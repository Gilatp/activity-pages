<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דפי פעילות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<style>
/* layout idea: a quiet trail down the middle of a cream page; white cards with hairlines; one green action per screen */
:root{
  --bg:#FDFBF7;
  --card:#FFFFFF;
  --line:#E6E0D4;
  --ink:#2A2F2E;
  --muted:#6E716C;
  --brand:#3C7A71;
  --brand-soft:#E3EEEB;
  --warm:#F3EBDD;
  --accent:#E9A23B;
  --rose:#E07A6A;
  --font-display:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --font-body:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
body{min-height:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.9rem}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:880px;margin:0 auto;padding:16px 18px 48px}
.narrow{max-width:640px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;max-width:880px;margin:0 auto}
.brandmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brandmark b{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:.95rem}
.who .av{width:38px;height:38px;border-radius:50%;background:var(--warm);display:grid;place-items:center;font-size:1.3rem;border:1px solid var(--line)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px;font-size:.9rem}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--brand);cursor:pointer;font-weight:500;padding:6px 0;text-decoration:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:11px 20px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);transition:transform .12s ease,background .15s}
.btn:hover{background:#FAF7F1}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-family:var(--font-display);font-size:1.1rem;padding:14px 30px}
.btn.primary:hover{background:#346B63}
.btn.primary[disabled]{opacity:.45;cursor:default}
.btn.small{padding:8px 14px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.97rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:#24524B;font-weight:500}

/* welcome */
.welcome{max-width:560px;margin:28px auto;padding:0 18px}
.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avatar{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:2.1rem;cursor:pointer;display:grid;place-items:center}
.avatar[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:var(--card);color:var(--ink)}
.field:focus{border-color:var(--brand);outline:none}
label.lbl{font-family:var(--font-display);font-weight:500;display:block;margin-bottom:8px}

/* path */
.hello{text-align:center;padding:8px 0 4px}
.hello p{color:var(--muted)}
.trail{position:relative;margin:10px auto 0;max-width:560px}
.trail svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.station{position:relative;display:flex;width:56%;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);padding:14px 0;cursor:pointer;background:none;border:none}
.station.right{margin-inline-start:0}
.station.left{margin-inline-start:44%}
.station .art{width:150px;height:150px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 0 var(--warm);transition:transform .2s ease}
.station:hover .art{transform:translateY(-3px) rotate(-2deg)}
.station .num{position:absolute;top:14px;inset-inline-start:calc(50% - 82px);width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--font-display);font-weight:600;display:grid;place-items:center;font-size:1.05rem}
.station .word{font-family:var(--font-display);font-size:1.2rem;margin-top:12px;font-weight:500}
.station .ext{font-size:.78rem;color:var(--muted)}
.station.star .art{border-color:#CFE0DC;box-shadow:0 6px 0 var(--brand-soft)}

.mine{margin-top:34px}
.mine h3{margin-bottom:10px}
.mineRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mineItem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.9rem;overflow:hidden}
.mineItem .e{font-size:1.7rem;display:block}
.mineItem span.t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.copy{font-size:.82rem;color:var(--muted)}

/* create */
.steps{display:flex;gap:8px;margin:12px 0 18px}
.steps span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps span.on{background:var(--brand)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.typeCard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.typeCard[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.typeCard svg{width:64px;height:64px}
.typeCard b{font-family:var(--font-display);font-weight:500}
.typeCard small{color:var(--muted);font-size:.82rem;line-height:1.3}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvl{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer;text-align:center}
.lvl b{display:block;font-family:var(--font-display);font-weight:500}
.lvl small{color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;align-items:center}

.loading{text-align:center;padding:60px 10px}
.loading .pencil{width:120px;height:120px;margin:0 auto 18px}
.loading p{font-family:var(--font-display);font-size:1.3rem;min-height:2.2em}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.pencil g.p{transform-origin:60px 60px;animation:wob 1.4s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
.pencil path.d{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 2.4s ease-in-out infinite alternate}

/* activity */
.actHead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.actHead .e{font-size:2.2rem}
.preview{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;justify-content:center}
.preview svg{width:100%;max-width:440px;height:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.play{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative}
.stage{width:100%;max-width:560px;margin:0 auto;position:relative;touch-action:none}
.stage svg,.stage canvas{display:block;width:100%;height:auto}
.progress{height:8px;border-radius:8px;background:var(--warm);overflow:hidden;margin:6px auto 10px;max-width:560px}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.note{text-align:center;color:var(--muted);min-height:1.6em;margin-top:8px}

.dot{cursor:pointer}
@keyframes pulse{0%,100%{r:11}50%{r:20}}
.dot.hint circle.c{animation:pulse 1s ease-in-out 3;fill:var(--accent)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* paint */
.paintLayout{display:grid;grid-template-columns:1fr;gap:12px}
.canvasBox{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);touch-action:none}
.canvasBox canvas{position:absolute;inset:0;width:100%;height:100%}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tool[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand)}

/* maze */
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:12px}
.dpad button{border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:1.4rem;cursor:pointer}
.dpad .up{grid-column:2;grid-row:1}
.dpad .l{grid-column:3;grid-row:2}
.dpad .dn{grid-column:2;grid-row:2}
.dpad .r{grid-column:1;grid-row:2}

/* grid copy */
.gridPair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gridPair .lab{text-align:center;font-family:var(--font-display);margin-bottom:6px}

/* typing */
.sky{position:relative;height:380px;border-radius:14px;overflow:hidden;background:linear-gradient(#21384A,#3C5E6B);touch-action:manipulation}
.sky .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6}
.fall{position:absolute;top:-40px;transform:translateX(50%);background:#FDFBF7;color:var(--ink);border-radius:12px;padding:4px 12px;font-family:var(--font-display);font-size:1.5rem;font-weight:500;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.fall.match{background:#FFE7B8}
.fall.pop{transition:transform .3s,opacity .3s;transform:translateX(50%) scale(1.4);opacity:0}
.typed{text-align:center;font-family:var(--font-display);font-size:1.6rem;min-height:2.2em;margin-top:10px;letter-spacing:.06em}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:10px;align-items:center}
.kb div{display:flex;gap:5px;flex-wrap:nowrap}
.kb button{min-width:34px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-family:var(--font-display);font-size:1.15rem;cursor:pointer;padding:0 6px}
.modeTabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}

/* celebration */
.overlay{position:fixed;inset:0;background:rgba(42,47,46,.35);display:grid;place-items:center;z-index:20;padding:16px}
.celebrate{background:var(--bg);border-radius:24px;padding:28px 22px;max-width:420px;width:100%;text-align:center;border:1px solid var(--line);position:relative;overflow:hidden}
.celebrate h2{font-size:2rem;margin:8px 0 4px}
.celebrate .acts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.celebrate{animation:rise .35s ease-out}
.confetti{position:absolute;width:8px;height:14px;border-radius:2px;top:-20px;opacity:.85}
@keyframes drop{to{transform:translateY(520px) rotate(540deg)}}

/* parents */
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.world{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:start}
.world b{font-family:var(--font-display);font-size:1.15rem;font-weight:500}
.world small{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;cursor:pointer;text-align:center;font-size:.88rem}
.cat .e{font-size:1.6rem;display:block}
.cat[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}

/* print */
.printPage{background:#EDE8DE;min-height:100vh;padding:16px}
.printBar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.sheet{width:100%;max-width:760px;margin:0 auto;aspect-ratio:1000/1414;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.sheet svg{width:100%;height:100%;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:40;font-size:.95rem;max-width:90vw;text-align:center}
@media print{
  @page{size:A4 portrait;margin:0}
  .printBar,.toast,.topbar{display:none!important}
  .printPage{background:#fff;padding:0}
  .sheet{max-width:none;width:210mm;height:297mm;box-shadow:none}
}

@media (max-width:620px){
  h1{font-size:1.55rem}
  .types{grid-template-columns:repeat(2,1fr)}
  .levels{grid-template-columns:repeat(2,1fr)}
  .worlds{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(3,1fr)}
  .station{width:62%}
  .station.left{margin-inline-start:38%}
  .station .art{width:118px;height:118px}
  .station .num{inset-inline-start:calc(50% - 68px)}
  .mineRow{grid-template-columns:repeat(2,1fr)}
  .gridPair{grid-template-columns:1fr}
  .kb button{min-width:27px;height:40px;font-size:1rem;padding:0 3px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

</style>
</head>

<script>
/* ===== Original SVG art: stations, type icons, local line-art library, dot outlines ===== */
const INK = "#2A2F2E";

const STATION_ART = {

    <rect x="22" y="22" width="76" height="76" rx="6" fill="#F3EBDD" stroke="${INK}" stroke-width="2.5"/>

    <rect x="18" y="30" width="44" height="44" rx="10" fill="#E3EEEB" stroke="${INK}" stroke-width="2.5" transform="rotate(-6 40 52)"/>
    <text x="40" y="64" text-anchor="middle" font-family="Rubik,sans-serif" font-size="30" font-weight="600" fill="#3C7A71" transform="rotate(-6 40 52)">א</text>
    <rect x="58" y="48" width="44" height="44" rx="10" fill="#F7D9A8" stroke="${INK}" stroke-width="2.5" transform="rotate(7 80 70)"/>
    <text x="80" y="82" text-anchor="middle" font-family="Rubik,sans-serif" font-size="26" font-weight="600" fill="${INK}" transform="rotate(7 80 70)">2+3</text>
    <circle cx="90" cy="28" r="3" fill="#E9A23B"/><circle cx="24" cy="94" r="3" fill="#E07A6A"/>
  </svg>`,
  lands: `<svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
    <path d="M18 34l26-8 30 8 28-8v62l-28 8-30-8-26 8z" fill="#F3EBDD" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>

    <circle cx="62" cy="45" r="5" fill="#fff"/>

  globie: `<svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
    <ellipse cx="60" cy="60" rx="46" ry="15" fill="none" stroke="#E9A23B" stroke-width="2.5" transform="rotate(-18 60 60)"/>
    <circle cx="60" cy="60" r="30" fill="#BFDCE8" stroke="${INK}" stroke-width="2.5"/>

const TYPE_ICON = {
  dots: STATION_ART.dots, coloring: STATION_ART.color, maze: STATION_ART.maze, typing: STATION_ART.letters,
  paint: `<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="20" y="24" width="80" height="72" rx="10" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="50" cy="58" r="16" fill="#F7D9A8" stroke="${INK}" stroke-width="2.5"/><path d="M58 60l26 26" stroke="#3C7A71" stroke-width="7" stroke-linecap="round"/><path d="M80 82l8 8" stroke="${INK}" stroke-width="7" stroke-linecap="round"/></svg>`,

};

/* ---- Local line-art library. viewBox 0 0 400 400. Closed shapes fill white (later shapes cover earlier). ---- */
function starPts(cx, cy, R, r, n = 5, rot = -90) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const a = (rot + i * 180 / n) * Math.PI / 180, rr = i % 2 ? r : R;

    const opts = D.filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < w && ny < h && !seen[ny * w + nx]; });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy, b, ob] = pick(opts), nx = x + dx, ny = y + dy;
    c[y * w + x] &= ~b; c[ny * w + nx] &= ~ob; seen[ny * w + nx] = 1; stack.push([nx, ny]);
  }
  return { w, h, cells: c.map(v => v.toString(16)).join(""), start: [w - 1, 0], end: [0, h - 1] };
}
function mazeCells(m) { return m.cells.split("").map(ch => parseInt(ch, 16)); }
function mazeWalls(m, ox, oy, cs) {
  const c = mazeCells(m); let d = "";
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const v = c[y * m.w + x], X = ox + x * cs, Y = oy + y * cs;
    if (v & 1 && !(x === m.start[0] && y === m.start[1])) d += `M${X} ${Y}h${cs}`;
    if (v & 8) d += `M${X} ${Y}v${cs}`;
    if (y === m.h - 1 && v & 4 && !(x === m.end[0] && y === m.end[1])) d += `M${X} ${Y + cs}h${cs}`;
    if (x === m.w - 1 && v & 2) d += `M${X + cs} ${Y}v${cs}`;
  }
  return d;
}

/* ---- Math & letters for the typing game ---- */
function mathItem(level) {
  let a, b, op;
  if (level === 1) { a = rnd(1, 5); b = rnd(1, 5); op = "+"; }
  else if (level === 2) { op = pick(["+", "-"]); a = rnd(3, 15); b = rnd(1, op === "-" ? a : 10); }
  else if (level === 3) { op = pick(["+", "-", "×"]); if (op === "×") { a = rnd(2, 5); b = rnd(2, 10); } else { a = rnd(10, 60); b = rnd(1, op === "-" ? a : 40); } }
  else { op = pick(["×", "×", "-", "+"]); if (op === "×") { a = rnd(3, 10); b = rnd(3, 10); } else { a = rnd(20, 99); b = rnd(5, op === "-" ? a : 99); } }
  const ans = op === "+" ? a + b : op === "-" ? a - b : a * b;
  return { show: `${a} ${op} ${b}`, answer: String(ans) };
}
const LETTERS = "אבגדהוזחטיכלמנסעפצקרשת".split("");

/* ---- The main generator ---- */
async function generateActivity(o, onStatus) {
  const theme = themeFor(o.topic);
  const a = {
    id: uid(), title: o.topic, category: o.category || null, prompt: o.topic, type: o.type, level: o.level, style: o.style,
    emoji: theme.e, imageColor: null, imageLines: null, data: {}, dotCount: 0, createdAt: Date.now(), source: "local"
  };
  if (o.type === "coloring" || o.type === "paint" || o.type === "grid") {
    let markup = o.linesOverride || null;
    if (!markup) { markup = await aiLineArt(o.topic, o.level, o.style); if (markup) a.source = "ai"; }
    if (!markup) markup = LINE_ART[theme.art];
    a.imageLines = markup; a.imageColor = colorize(markup, o.style);
    if (o.type === "grid") a.data.n = [4, 6, 8, 10][o.level - 1];
  } else if (o.type === "dots") {
    let r = await aiDots(o.topic, o.level, o.style, onStatus);
    if (r) a.source = "ai"; else r = localDots(theme, o.level);
    a.data = { points: r.points, outline: r.outline };
    a.dotCount = r.points.length;
    a.imageLines = outlineMarkup(r.outline);
    a.imageColor = colorize(a.imageLines, o.style);
  } else if (o.type === "maze") {
    const [w, h] = MAZE_SIZE[o.level];
    a.data = makeMaze(w, h);
  } else if (o.type === "typing") {
    a.data = { words: shuffle(WORDS[o.level]).slice(0, 12) };
  }
  if (theme.guessed && a.source === "local" && (o.type !== "maze" && o.type !== "typing")) a.data.localArt = true;
  return a;
}

      let nxv = dy / L, nyv = -dx / L; if (!cw) { nxv = -nxv; nyv = -nyv; }

    body += `<path d="${mazeWalls(m, ox, oy, cs)}" stroke="${INK}" stroke-width="${Math.max(4, cs / 9).toFixed(1)}" stroke-linecap="round" fill="none"/>`;
    const sx = ox + (m.start[0] + .5) * cs, ex = ox + (m.end[0] + .5) * cs;
    body += `<text x="${sx}" y="${oy - 18}" font-size="${Math.min(56, cs * .9)}" text-anchor="middle">${a.emoji}</text>`;
    body += T(sx, oy - 74, 24, "התחלה", `font-weight="600"`);
    body += T(ex, oy + H + 44, 26, "🏁 יעד", `font-weight="600"`);
    body += T(500, oy + H + 100, 24, "מעבירים קו מההתחלה ועד היעד בלי לחצות קירות", `fill="#6E716C"`);
  } else if (a.type === "grid") {
    const n = a.data.n, ex = 330, ey = 230, es = 340;
    body += `<rect x="${ex}" y="${ey}" width="${es}" height="${es}" fill="#fff"/>` + artGroup(color ? a.imageColor : a.imageLines, ex, ey, es, 6);
    let gl = ""; for (let i = 0; i <= n; i++) { const t = i * es / n; gl += `M${ex + t} ${ey}v${es}M${ex} ${ey + t}h${es}`; }
    body += `<path d="${gl}" stroke="${color ? "#3C7A71" : "#888"}" stroke-width="1.6" fill="none"/>`;

    if (n <= 6) for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) body += `<text x="${gx + gs - (c + .5) * gs / n}" y="${gy + (r + .5) * gs / n + 8}" font-family="${F}" font-size="20" fill="#C9C2B4" text-anchor="middle">${String.fromCharCode(1488 + r)}${c + 1}</text>`;

/* ---- rasterize SVG to canvas/blob ---- */
function svgToImage(svg) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}
async function svgToPngBlob(svg, w, h) {
  const img = await svgToImage(svg);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  return await new Promise(r => c.toBlob(r, "image/png"));
}
async function offerDownload(blob, filename) {
  await capReady;
  if (!CAP.downloads) {
    try {
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) { toast("השמירה לא הצליחה, אפשר לנסות שוב"); }
    return;
  }
  try { await CAP.downloads.save({ filename, data: blob }); toast("נשמר"); }
  catch (e) { if (e && e.code !== "declined") toast("השמירה לא הצליחה, אפשר לנסות שוב"); }
}

}

  $("#go").onclick = () => startCreate({ world: wid });
}

route();

</script>
